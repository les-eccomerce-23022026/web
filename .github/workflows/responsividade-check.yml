name: Responsividade Mobile-First Check

on:
  pull_request:
    paths:
      - 'src/**/*.css'
      - 'src/**/*.module.css'
      - 'app/**/page.tsx'
      - 'app/components/**/*.tsx'
      - 'src/components/**/*.tsx'

jobs:
  responsividade-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Check for max-width media queries (desktop-first)
        run: |
          echo "Verificando media queries desktop-first (max-width)..."
          if grep -r "@media.*max-width" src/ app/ --include="*.css" --include="*.module.css"; then
            echo "❌ Encontrado @media max-width (desktop-first). Use @media min-width (mobile-first)."
            exit 1
          else
            echo "✅ Nenhum @media max-width encontrado."
          fi

      - name: Check for fixed widths
        run: |
          echo "Verificando larguras fixas problemáticas..."
          # Exemplo: width: 500px sem media query
          if grep -rP "width:\s*\d{3,}px" src/ app/ --include="*.css" --include="*.module.css" | grep -v "@media"; then
            echo "⚠️  Encontradas larguras fixas. Verifique se têm media query correspondente."
          fi

      - name: Check touch targets
        run: |
          echo "Verificando touch targets em botões..."
          # Apenas alerta, não falha build
          echo "ℹ️  Valide manualmente: botões devem ter altura mínima de 44px em mobile"
